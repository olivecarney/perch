[package]
name = "perch"
version = "0.1.2"
edition = "2024"
rust-version = "1.98"
description = "A small, quiet home for your homelab"
license = "MIT"
repository = "https://github.com/olivecarney/perch"

[dependencies]
topcoat = { version = "=0.10.0", default-features = false, features = ["serve", "view"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
